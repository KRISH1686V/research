# OP3 r17wS (12 Nov 2026): the round 17wS budget method on a second 12-DOF servo biped, the Robotis OP3 (MuJoCo Menagerie robotis_op3, arms and head
# welded at a neutral pose; envs/op3/README.md). NO gait reference, no gait clock, no gait shaping: velocity tracking (r17wS's command-relative kernel),
# progress and standard regularization (base motion, torso tilt), as the 5 Nov 2026 benchmark (v2_deploy_budget_alpha30.yaml) plus tilt_limit. Budget settings are r17wS's
# (costs flight, slip, jshake; soft gate; u_low -0.3; settle_steps 5; window and burst 100); rates from measured OP3 costs (see token_budget).
# Budgets-off twin: op3_budget_off.yaml (only token_budget differs, as c17plain against r17j).
# Train with the deploy flags of run_budget_deploy.sh: --realism full --plain_ckpt --difficulty_ramp 0.4 --layer_norm --avg_q --ema_tau 0.002 --asym --mirror
#   --actor_hide achieved,levels --save_critic (the OP3 mirror maps are picked from env.robot_type).
env:
  robot_type: op3  # envs/op3: fast/collector.env_class and fast/train.py's mirror maps switch on this key; biped configs do not have it
  xml_path: "/home/rpuser1/yasho/rl/BipedRobot/envs/assets/robotis_op3/scene_train.xml"
  require_xml: "/home/rpuser1/yasho/rl/BipedRobot/envs/assets/robotis_op3/scene_train.xml"
  frame_skip: 10  # Menagerie's 2 ms timestep (its contact solref 4 ms needs <= 2 ms); 50 Hz control as the biped. Flight is counted in tenths of a step
  achieved_goal_window_sec: 0.5
  max_episode_steps: 500
  realism: easy
  push_enabled: false
  op3:
    action_scale_rad: [0.3, 0.8, 0.3, 0.8, 0.6, 0.3]  # per leg: hip yaw, hip pitch, hip roll, knee, ankle pitch, ankle roll; target = standing pose + side * a * scale
    slip_reference: contact  # slip is the contact point's speed; "biped_code" reproduces the biped's lever arm (envs/op3/op3_env.py, README)
robot:
  default_qpos: [0.0, 0.4, 0.0, -0.8, -0.4, 0.0, 0.0, -0.4, 0.0, 0.8, 0.4, 0.0]  # r then l: hip yaw, hip pitch, hip roll, knee, ankle pitch, ankle roll; hips 0.4, knees 0.8, ankles 0.4 rad (feet level, hips 18 mm down); right = -left in the OP3's joint conventions
action:
  range_fraction: 0.5  # not read by the OP3 env (env.op3.action_scale_rad sets its action map)
obs_scale:
  joint_pos: 1.0
  joint_vel: 0.05
  base_ang_vel: 0.25
  proj_gravity: 1.0
  prev_action: 1.0
actuator:
  torque_limit: 5.0  # Menagerie op3.xml position actuators: kp 21.1 N m/rad, forcerange +-5 N m
  delay_sec: 0.010
  delay_range: [0.0, 0.020]  # assumed: Dynamixel bus at 125 Hz plus the control loop; not measured on an OP3
  servo_lag_tau: 0.020  # off below: the PD actuator is the servo model
  backlash_deadband: 0.0
  enable_delay: true
  enable_lag: false
  enable_backlash: false
domain_randomization:
  enabled: true
  friction_range: [0.4, 1.0]  # times the floor's 1.0 (validity.friction makes the floor's value apply)
  mass_scale_range: [0.85, 1.15]  # torso 1.35 kg
  motor_strength_range: [0.85, 1.15]
  push_interval: 125
  push_magnitude: 6.0  # N for 0.1 s on 3.15 kg: 0.19 m/s, the biped's 3 N on 1.66 kg
termination:
  min_torso_height: 0.16  # torso origin stands at 0.26 m
  max_torso_height: 0.40
  min_upright_cosine: 0.82  # a fall at 35 deg, as r17wS
goal_ranges:
  vx: [0.0, 0.5]
  vy: [-0.2, 0.2]
  wz: [-0.5, 0.5]
curriculum:
  enabled: false
  initial_vx: [0.10, 0.25]  # OP3 command range, envs/op3/README.md: the biped's Froude number at the low end, about 0.45 leg lengths a step at 2.5 steps/s at the top
  initial_vy: [0.0, 0.0]  # straight only, as r17wS
  initial_wz: [0.0, 0.0]
  success_threshold: 0.70
  expansion_rate: 1.15
  window_size: 30
  p_zero_cmd: 0.15  # as r17wS
shaping:
  gait_shaping: false  # no gait terms (5 Nov benchmark)
  action_filter: true
  prev_action_obs: true
  smooth_penalties: true
  reset_velocity: true
  action_filter_alpha: 0.30  # 5 Nov benchmark
  progress_weight: 0.30
  air_time_weight: 3.0
  single_support_weight: 0.05
  swing_clearance_weight: 0.0
  flight_penalty_weight: -0.5
  zero_touchdown_weight: -0.3
  action_rate_weight: 0.0
  action_second_diff_weight: 0.0
  joint_accel_weight: 0.0
  posture_weight: 0.0
  base_motion_weight: 0.05  # regularization: 0.05 (vz^2 + wx^2 + wy^2), legged_gym's ang_vel_xy weight
  tilt_limit: {deg: 8, span_deg: 8, penalty: 1.0}  # regularization, as r17wS: cost for torso tilt past 8 deg
  smoothness_ramp: 1.0
  smoothness_ramp_fraction: 0.4
  reset_velocity_probability: 0.5
reward:
  mode: track
  sigma_v: 0.15
  sigma_w: 0.15
  track_rel: {v_rel: 0.4, v_min: 0.03, w_rel: 0.7, w_min: 0.10}  # as r17wS: a tracking kernel, not a gait term. With sigma 0.15 standing still at 0.1 m/s would keep 0.80 of tracking (the biped's standing trap); here 0.002
  fall_penalty: 25.0
her:
  capacity: 200000
  relabel_strategy: future
  relabel_dims: [vx]  # as r17wS: vy and wz keep the stored 0
  relabel_k: 4
  n_sampled_goal: 2
sac:
  hidden_dim: 256
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  updates_per_step: 1
  warmup_steps: 100
  learning_starts: 5000
validity:
  friction: true
  motor_torque: true
  push_s: 0.1
  servo_curve: {stall_nm: 4.1, noload_rad_s: 4.82, cap_nm: 5.0}  # XM430-W350 datasheet at 12 V (4.1 N m stall, 46 rpm no load), not identified on an OP3; cap = Menagerie's 5 N m
  history: 5
  obs_noise: {joint_pos: 0.002, joint_vel: 0.05, gyro: 0.02, gravity: 0.02}  # assumed, as the biped's; the Dynamixel reports its own speed
  encoder_rad: 0.00153398  # 4096-step encoder, as the biped's servos
  obs_bias: {joint_pos: 0.0175, gyro: 0.02, gravity: 0.05}  # assumed, as the biped's
token_budget:
  costs: [flight, slip, jshake]  # as r17wS, same definitions (fast/gait_costs.py, fast/budget_env.py)
  # Rates from OP3 costs measured before training (diagnostics/op3: scripted open-loop walks at 0.1-0.25 m/s, easy and full realism, with and without
  # action noise; standing; uniform random actions; summarize_costs.py). With window = burst = 100 a bucket is overdrawn only when some T <= 100 steps cost more than r (T + 100): a steady cost binds above 2 r.
  # u = 0 (2 r_min): below every measured walk's slip (min 0.0046) and jshake (min 1.68e-5), and below the median flight of walks at >= 0.15 m/s;
  # flight 0.001 is the lowest rate whose bucket (0.1) still holds one 2 ms flight substep. u = 1 (2 r_max): above every measured 100-step window
  # (flight 0.175, slip 0.050, jshake 5.9e-5) and random exploration (0.063, 0.020, 8.7e-5). No capacity floor.
  rate_min: [0.001, 0.002, 0.000007]
  rate_max: [0.1, 0.05, 0.00015]
  overdraft: soft
  u_low: -0.3
  settle_steps: 5
  burst_steps: 100
  window_steps: 100
  p_unconstrained: 0.2
  p_keep: 0.25
  p_achieved: 0.5
  alive_bonus: 0.2
  curriculum: true
