train:
  seed: 42
  steps: 30000000
  max_episode_steps: 1000
  worker_groups: 4
  workers_per_group: 4
  sim_frequency: 100
  use_history: False
  history_size: 0
  log_dir: "runs"
  checkpoint_path: "checkpoints/"
  model_name: "author_walking_sac"
  overwrite_model: false

  model: "sac"

  test_environment: false
  epoch_steps: 5000
  save_steps: 50000

  test_episodes: 5
  show_progress: false
  replace_checkpoint: false
  log: true

model:
  actor_sizes: [256, 256]
  critic_sizes: [256, 256]
  target_coeff: 0.005
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  lr_scheduler:
    scheduler_type: "cosine"
    T_max: 500000
    eta_min: 1.0e-5

buffer:
  size: 1000000
  return_steps: 5
  batch_iterations: 50
  batch_size: 1024
  discount_factor: 0.99
  steps_before_batches: 10000
  steps_between_batches: 50
  seed: 42
