train:
  seed: 43
  steps: 400000
  max_episode_steps: 1000
  worker_groups: 4
  workers_per_group: 4
  sim_frequency: 100
  use_history: true
  history_size: 5
  normalize_obs: true
  symmetry_augmentation: true
  actor_obs: "normal"
  critic_obs: "privileged"
  log_dir: "runs"
  checkpoint_path: "checkpoints/"
  model_name: "author_walk_16worker_v2"
  overwrite_model: true
  model: "sac"
  test_environment: false
  epoch_steps: 1000
  save_steps: 50000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: true

  env_config:
    reward_scale: 1.0
    reward_weights:
      track_lin_vel_xy_exp: 2.0
      track_ang_vel_z_exp: 0.8
      termination_penalty: -2.0
      flat_orientation_l2: -0.75
      lin_vel_z_l2: -0.5
      ang_vel_xy_l2: -0.02
      action_rate_l2: -0.05
      dof_torques_l2: -0.0005
      dof_pos_limits: -1.0
      feet_air_time: 0.5
      feet_slide: -1.5
      undesired_contacts: -0.5
      joint_deviation_hip: -0.15
      joint_deviation_ankle_roll: -0.05
      dof_pos_l2: -0.1
      foot_separation: -4.0
      action_l2: 0.0
    commands:
      base_velocity:
        ranges:
          lin_vel_x: [-0.3, 0.5]
          lin_vel_y: [-0.3, 0.3]
          ang_vel_z: [-0.3, 0.3]

model:
  actor_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]
  critic_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]
  target_coeff: 0.01
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  lr_scheduler:
    scheduler_type: "none"

exploration:
  scale: 0.3
  min_scale: 0.05
  decay_rate: 1.0e-7
  start_steps: 4096

buffer:
  size: 1000000
  return_steps: 5
  batch_iterations: 1
  batch_size: 512
  discount_factor: 0.99
  steps_before_batches: 4096
  steps_between_batches: 4
  seed: 43
